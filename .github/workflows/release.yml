name: Release
# Publishes @nestbun/platform to npm when a tag like v0.1.0 is pushed.
# Requires an NPM_TOKEN repository secret (npm → Access Tokens → Granular, publish scope).
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test packages
      - run: bun run --filter '@nestbun/platform' build
      - name: Publish
        working-directory: packages/platform
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
