name: Landing page
# Deploys apps/www to GitHub Pages. Enable once in the repo: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['apps/www/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/www
      - id: deployment
        uses: actions/deploy-pages@v4
